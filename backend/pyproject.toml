[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-sci"
version = "0.1.0"
description = "Phase 1 scaffold for the STEM-SCI traceable research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.2,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "scipy>=1.12,<2",
  "statsmodels==0.14.6",
  "typing-extensions>=4.12",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]
hybrid-retrieval = [
  "dashscope>=1.20,<2",
  "faiss-cpu>=1.14,<2",
  "numpy>=1.24,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stem_sci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
