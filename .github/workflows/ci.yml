name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend/src backend/tests --config backend/pyproject.toml
      - name: Mypy
        run: mypy backend/src --config-file backend/pyproject.toml
      - name: Pytest
        run: pytest backend/tests
