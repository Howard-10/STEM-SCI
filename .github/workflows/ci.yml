name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        run: python -m ruff check backend/src backend/tests --isolated --target-version py311 --line-length 100 --select E4,E7,E9,F
      - name: Mypy
        run: python -m mypy backend/src --config-file backend/pyproject.toml
      - name: Pytest
        run: python -m pytest backend/tests
